name: stock-notify

on:
  schedule:
    - cron: "0 8 * * *"     # 08:00
    - cron: "30 12 * * *"   # 12:30
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run notify
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          MODE: ${{ github.event.schedule }}
        run: |
          if [ "${MODE}" = "0 8 * * *" ]; then
            MODE=morning python notify.py
          else
            MODE=noon python notify.py
          fi
