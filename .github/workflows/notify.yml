name: stock-notify

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "30 12 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run notify
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "CRON_SCHEDULE=${CRON_SCHEDULE}"

          if [ -z "${CRON_SCHEDULE}" ]; then
            echo "手動実行なので MODE=opening として実行します"
            MODE=opening python notify.py

          elif [ "${CRON_SCHEDULE}" = "0 8 * * *" ]; then
            MODE=opening python notify.py

          elif [ "${CRON_SCHEDULE}" = "30 12 * * *" ]; then
            MODE=noon python notify.py

          elif [ "${CRON_SCHEDULE}" = "0 15 * * *" ]; then
            MODE=close python notify.py

          else
            MODE=unknown python notify.py
          fi
