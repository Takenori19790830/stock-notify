name: stock-notify

on:
  schedule:
    - cron: "0 8 * * *"      # 08:00 寄り付き
    - cron: "30 12 * * *"    # 12:30 後場寄り付き
    - cron: "0 15 * * *"     # 15:00 引け
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # ← Node.js 24 対応

      - name: Set up Python
        uses: actions/setup-python@v5   # ← Node.js 24 対応
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run notify (MODE 切り替え)
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "CRON_SCHEDULE=${CRON_SCHEDULE}"

          if [ "${CRON_SCHEDULE}" = "0 8 * * *" ]; then
            MODE=opening python notify.py

          elif [ "${CRON_SCHEDULE}" = "30 12 * * *" ]; then
            MODE=noon python notify.py

          elif [ "${CRON_SCHEDULE}" = "0 15 * * *" ]; then
            MODE=close python notify.py

          else
            MODE=unknown python notify.py
