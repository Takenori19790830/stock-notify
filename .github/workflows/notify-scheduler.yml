name: notify-scheduler

on:
  schedule:
    - cron: "0 3 * * *"   # JST 12:00

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests yfinance pandas

      - name: Run notify.py
        run: python notify.py
